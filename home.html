<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2137">
  <meta name="description" content="IIK Tailor — Stitching Your Style. Premium men's fashion and custom tailoring.">
  <title>IIK Tailor — Stitching Your Style</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="shell">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M4 11h16M4 15h10"/>
          <circle cx="17" cy="15" r="2.6"/>
          <path d="M3 19c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/>
        </svg>
      </span>
      <span class="titles">
        <span class="name">IIK Tailor</span>
        <span class="tag">Stitching Your Style</span>
      </span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="cartBtn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h2l2.4 12.2a1.5 1.5 0 0 0 1.5 1.2h7.7a1.5 1.5 0 0 0 1.5-1.2L20 8H6"/>
          <circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/>
        </svg>
        <span class="badge" id="cartCount">0</span>
      </button>
      <button class="icon-btn" id="accountBtn" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.4 4.4-5 8-5s6.5 1.6 8 5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== Search ===== -->
  <div class="search-wrap">
    <label class="search">
      <span class="mag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg></span>
      <input type="search" id="searchInput" placeholder="Search for designs..." aria-label="Search for designs">
      <button class="filter" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="17" r="1.8"/></svg>
      </button>
    </label>
  </div>

  <!-- ===== Views ===== -->
  <main id="views">

    <!-- Home -->
    <section class="view" id="view-home">
      <div class="hero" id="hero">
        <div class="track" id="heroTrack">
          <div class="slide s1">
            <span class="kicker">Premium Men's Fashion</span>
            <span class="title">Tailored to Perfection</span>
            <button class="cta">Customize Now
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
          <div class="slide s2">
            <span class="kicker">Wedding &amp; Events</span>
            <span class="title">Made-to-Measure Suits</span>
            <button class="cta">Book a Fitting
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
          <div class="slide s3">
            <span class="kicker">Festive Collection</span>
            <span class="title">Elegant Shalwar Kameez</span>
            <button class="cta">Shop Now
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="dots" id="heroDots">
          <button class="on" aria-label="Slide 1"></button>
          <button aria-label="Slide 2"></button>
          <button aria-label="Slide 3"></button>
        </div>
      </div>

      <nav class="chips" id="home-chips" aria-label="Categories"></nav>

      <div class="section-head">
        <span class="left">
          <span class="star"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.6 6.4 19.5l1.3-6.2L3 9l6.3-.7z"/></svg></span>
          Our Collection
        </span>
        <a class="view" href="#" id="viewAll">View All
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </div>

      <div class="grid" id="home-grid"></div>

      <div class="promo">
        <div class="txt">
          <div class="h">Custom Stitching 🪡</div>
          <div class="s">Need a custom design? Get your outfit stitched to measure</div>
        </div>
        <button class="btn" id="customizeBtn">Customize
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- Categories -->
    <section class="view hidden" id="view-categories"></section>

    <!-- Product detail -->
    <section class="view hidden" id="view-product"></section>

    <!-- Cart -->
    <section class="view hidden" id="view-cart"></section>

    <!-- Favorites -->
    <section class="view hidden" id="view-favorites"></section>

    <!-- Orders -->
    <section class="view hidden" id="view-orders"></section>

    <!-- More -->
    <section class="view hidden" id="view-more"></section>

    <!-- Custom stitching wizard -->
    <section class="view hidden" id="view-custom"></section>

    <!-- Owner / Manager dashboard -->
    <section class="view hidden" id="view-manager"></section>

  </main>
</div><!-- /shell -->

<!-- ===== Bottom nav ===== -->
<nav class="bottomnav" aria-label="Main">
  <div class="inner">
    <a class="nav-item on" href="#" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h3.5v-5h5v5H18a1 1 0 0 0 1-1V9.5"/></svg>
      Home
    </a>
    <a class="nav-item" href="#" data-view="categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Categories
    </a>
    <a class="nav-item" href="#" data-view="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2 12h11l2-8H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      My Orders
    </a>
    <a class="nav-item" href="#" data-view="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.3-8.6C1 8.5 3 5 6.3 5c2 0 3.4 1.1 4.2 2.4.8-1.3 2.2-2.4 4.2-2.4C18 5 20 8.5 18.3 11.4 16 15.6 12 20 12 20z"/></svg>
      Favorites
    </a>
    <a class="nav-item" href="#" data-view="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      More
    </a>
  </div>
</nav>

<div id="toast"></div>

<script src="js/store.js"></script>
<script>
/* Hero carousel (home view only) */
(function () {
  var track = document.getElementById('heroTrack');
  var dots = Array.prototype.slice.call(document.querySelectorAll('#heroDots button'));
  var idx = 0, timer;
  function go(i) {
    idx = (i + dots.length) % dots.length;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    dots.forEach(function (d, j) { d.classList.toggle('on', j === idx); });
  }
  function auto() { clearInterval(timer); timer = setInterval(function () { go(idx + 1); }, 4000); }
  dots.forEach(function (d, i) { d.addEventListener('click', function () { go(i); auto(); }); });
  auto();
  var viewAll = document.getElementById('viewAll');
  if (viewAll) viewAll.addEventListener('click', function (e) { e.preventDefault(); window.Store.show('categories'); });
  var customize = document.getElementById('customizeBtn');
  if (customize) customize.addEventListener('click', function () { window.Store.show('custom'); });
})();
</script>
</body>
</html>
